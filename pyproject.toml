[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-xauusd-trader"
version = "0.1.0"
description = "Local-first, risk-gated multi-agent trading system foundation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dashboard = ["streamlit>=1.40,<2"]
dev = ["mypy>=1.13,<2", "pandas-stubs>=2.2,<3", "pytest>=8.3,<9", "ruff>=0.8,<1"]
dataset = ["pyarrow>=18,<24"]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2"]
future-ml = [
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "torch>=2.5,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "optuna>=4.1,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["axq"]
