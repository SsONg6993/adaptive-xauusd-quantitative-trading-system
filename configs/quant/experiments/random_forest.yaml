schema_version: "1.0"
name: random-forest
output_root: ../../../runtime/experiments/quant
training:
  architecture: random_forest
  dataset_dir: ../../../datasets/generated/DATASET_ID
  preprocessing: {imputation: median, scaler: none}
  feature_selection: {variance_threshold: 0.0, correlation_threshold: 0.995}
  model_hyperparameters: {n_estimators: 400, max_depth: 12, min_samples_leaf: 10, n_jobs: -1}
  random_seed: 42
  class_weighting: balanced
  calibration: {method: sigmoid}
  hold_policy: {minimum_confidence: 0.55, explicit_neutral_class: true}
  output_root: ../../../runtime/models/quant
  device: cpu
evaluation: {hold_thresholds: [0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]}
