schema_version: "1.0"
name: prior
output_root: ../../../runtime/experiments/quant
training:
  architecture: prior
  dataset_dir: ../../../datasets/generated/DATASET_ID
  preprocessing: {imputation: median, scaler: none}
  feature_selection: {}
  random_seed: 42
  class_weighting: none
  calibration: {method: none}
  hold_policy: {minimum_confidence: 0.50, explicit_neutral_class: true}
