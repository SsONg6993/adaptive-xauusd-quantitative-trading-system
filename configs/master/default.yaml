decision_mode: deterministic_weighted
hold_threshold: 0.20
minimum_confidence: 0.65
maximum_prediction_age_seconds: 15
minimum_similarity_samples: 20
weights:
  chart: 1.0
  quant: 1.0
  historical: 0.8
  news: 0.6
regime_weight_multipliers: {}
disagreement_penalty: 0.25
stale_agent_policy: exclude
